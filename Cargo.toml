[package]
name = "jetarm-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MCP server for the Hiwonder JetArm robot arm"
repository = "https://github.com/SCMU-AILAB/JetArmMCP"

[dependencies]
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serialport = { version = "4", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
dirs = "6"
tokio-util = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[dev-dependencies]
tempfile = "3"
